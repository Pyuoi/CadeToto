<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style-lvl1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
    <title>Cadê ToTó?</title>
</head>
<body>  
    <div class="game-board">
        <img src="imgs/scane1.png" alt="" class="main-background" id="background">
        <img src="imgs/dog.png" alt="" class="dogplayer WalkTrue lvl1" id="dog-player">
        <img src="imgs/nuvem.png" alt="" class="cloud1">
        <img src="imgs/nuvem.png" alt="" class="cloud2">
        <img src="imgs/bag-girl.png" alt="" class="girlbag" id="girlbag">
        <div class="fade" id="fade"></div>
       
       
        <div class="girl-div-baloon" id="girl-div-baloon">
            <img src="imgs/dialogbaloon.png" class="dialogbaloon-girl" id="dialogbaloon-girl" alt="">
            <p class="dialogtext1" id="dialogtext-1"></p>
            <img src="imgs/nextButton.png" alt="" class="nextbutton" id="nextbutton">
        </div>

        <div class="bagGame" id="bagGame">
            <div class="bag">
                <div class="info" id="info">
                    <h1>Como Jogar?</h1>
                    <h2>A bolsa da Senhora Flor está cheia de objetos! Encontre apenas os itens que aparecem na barra abaixo da bolsa. Será que você consegue ajudá-la?</h2>
                    <img src="imgs/BagGame/startbutton.png" alt="" id="startGame" class="startGame">
                </div>
                <img src="imgs/BagGame/bag.png" alt="" class="bagImg">
                <div class="itens">
                    <img src="imgs/BagGame/batom.png" class="item batom" alt="">
                    <img src="imgs/BagGame/Carteira.png" class="item carteira" alt=""> 
                    <img src="imgs/BagGame/Chiclete.png" class="item chiclete" alt="">
                    <img src="imgs/BagGame/Espelho.png" class="item espelho" alt="">
                    <img src="imgs/BagGame/Pente.png" class="item pente" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper1 paper" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper2 paper" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper3 paper" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper4 paper" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper5 paper" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper6 paper" alt="">
                    <img src="imgs/BagGame/paper-ball.png" class="item paper7 paper" alt="">
                </div>
            </div>
        </div>



    </div>
    <script src="js/MovePlayer.js"></script>
    <script src="js/Level 1/level1.js"></script> 
    <script src="js/Level 1/BagGame.js"></script>  
</body>
</html>
