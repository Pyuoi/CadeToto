<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/estrelas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="imgs/favicon.png">
    <title>Cadê ToTó?</title>
</head>
<body>
    <div class="game-board">
        <img src="imgs/main-background.png" alt="Cadê ToTó? Um senhor, uma moça e o cachorrinho Totó no parque." class="main-background">

        <button type="button" class="click-zone esq" id="btn-embora" aria-label="Ir embora"></button>
        <a class="click-zone dir" href="level1.html" aria-label="Brincar"></a>

        <!-- Mensagem de despedida do botão "Ir embora" -->
        <div class="adeus" id="adeus" role="dialog" aria-label="Até logo">
            <div class="adeus-caixa">
                <h2>Até logo! 👋</h2>
                <p>Quando quiser brincar de novo, o Totó vai estar esperando.</p>
                <button type="button" id="btn-voltar">Voltar</button>
            </div>
        </div>
    </div>

    <script src="js/stars.js"></script>
    <script>
        const adeus = document.getElementById('adeus');
        const btnVoltar = document.getElementById('btn-voltar');
        document.getElementById('btn-embora').addEventListener('click', () => {
            adeus.classList.add('aberto');
            btnVoltar.focus();
        });
        btnVoltar.addEventListener('click', () => adeus.classList.remove('aberto'));
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') adeus.classList.remove('aberto');
        });
    </script>
</body>
</html>
